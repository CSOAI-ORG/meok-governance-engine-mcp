name: meok-governance-engine-mcp
description: AI-powered meok governance engine MCP server for agents. Supports full
  governance report, which frameworks apply, compliance cost estimator. By MEOK AI
  Labs.
version: 1.0.0
tools:
- name: full_governance_report
  description: Generate a COMPLETE multi-framework governance report in one call.
  parameters:
  - name: system_name
    type: string
    required: true
  - name: system_description
    type: string
    required: true
  - name: jurisdictions
    type: string
    required: false
  - name: use_case
    type: string
    required: false
- name: which_frameworks_apply
  description: Instantly determine which AI governance frameworks apply to your situation.
  parameters:
  - name: country
    type: string
    required: true
  - name: industry
    type: string
    required: false
  - name: ai_use_case
    type: string
    required: false
- name: compliance_cost_estimator
  description: Estimate compliance costs and show how MEOK Governance Engine saves
    money.
  parameters:
  - name: systems_count
    type: integer
    required: false
  - name: risk_level
    type: string
    required: false
  - name: current_certifications
    type: string
    required: false
- name: list_all_tools
  description: List all 62 governance tools available in this engine.
  parameters: []
- name: compliance_score_engine
  description: Calculate compliance percentage per framework. Input system description,
    get scored breakdown.
  parameters:
  - name: system_description
    type: string
    required: true
  - name: frameworks
    type: string
    required: false
- name: get_full_audit_trail
  description: Get timestamped audit trail of all governance checks performed.
  parameters:
  - name: limit
    type: integer
    required: false
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
    - apiKey
    properties:
      apiKey:
        type: string
        description: Your MEOK API Key
  commandFunction: "(config) => ({\n  command: 'uvx',\n  args: ['meok-governance-engine-mcp',\
    \ '--api-key', config.apiKey],\n  env: {\n    MEOK_API_KEY: config.apiKey\n  }\n\
    })"
